[project]
name = "srd-arena"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.8,<3",
    "PySide6>=6.8,<7"
]

[project.scripts]
srd-arena = "game.main:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "app"}

[tool.setuptools.packages.find]
where = ["app"]
include = ["game*"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "hypothesis>=6.0,<7",
    "mypy>=2.1.0",
    "pytest>=7.4,<9",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.17",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
