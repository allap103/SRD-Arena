[project]
name = "srd-arena"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.8,<3",
    "PyYAML>=6.0.3,<7",
    "PySide6>=6.8,<7"
]

[project.optional-dependencies]
training = ["numpy>=2.3,<3", "torch>=2.10,<3"]
observability = ["tensorboard>=2.20,<3", "streamlit>=1.50,<2"]

[project.scripts]
srd-arena = "srd_arena.main:main"
srd-arena-train = "srd_arena.training.train:main"
srd-arena-evaluate = "srd_arena.training.evaluate:main"
srd-arena-inspect = "srd_arena.training.inspect:main"
srd-arena-watch = "srd_arena.training.watch:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["srd_arena*"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "numpy>=2.3,<3",
    "hypothesis>=6.0,<7",
    "interrogate>=1.7.0",
    "mypy>=2.1.0",
    "types-PyYAML>=6.0.12",
    "pytest>=7.4,<9",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.17",
]

[tool.pytest.ini_options]
addopts = ["--doctest-modules"]
testpaths = ["tests", "src/srd_arena"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.interrogate]
fail-under = 80
ignore-init-method = true
ignore-magic = true
ignore-private = true
ignore-semiprivate = true
