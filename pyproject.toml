[project]
name = "cyoa"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.9,<4",
    "networkx>=3.4,<4",
    "pydantic>=2.8,<3",
    "textual>=0.79,<1",
    "scipy"
]

[project.scripts]
render-scene-graph = "visualization.scene_graph:main"

[dependency-groups]
dev = [
    "hypothesis>=6.0,<7",
    "mypy>=2.1.0",
    "pytest>=7.4,<9",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.17",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
