[project]
name = "srd-arena"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.8,<3",
    "PySide6>=6.8,<7"
]

[project.scripts]
srd-arena = "srd_arena.main:main"
content-schema-docs = "srd_arena.tools.content_schema_docs:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["srd_arena*"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "erdantic>=1.2.1",
    "hypothesis>=6.0,<7",
    "json-schema-for-humans>=1.5.1",
    "mypy>=2.1.0",
    "pytest>=7.4,<9",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.17",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
