[project]
name = "srd-arena"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.116,<1",
    "matplotlib>=3.9,<4",
    "networkx>=3.4,<4",
    "pydantic>=2.8,<3",
    "PySide6>=6.8,<7",
    "uvicorn>=0.35,<1",
    "scipy"
]

[project.scripts]
srd-arena = "game.launcher:main"
scene-graph = "visualization.scene_graph:main"
render-scene-graph = "visualization.scene_graph:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "app"}

[tool.setuptools.packages.find]
where = ["app"]
include = ["game*", "visualization*"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "hypothesis>=6.0,<7",
    "mypy>=2.1.0",
    "pytest>=7.4,<9",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.17",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
