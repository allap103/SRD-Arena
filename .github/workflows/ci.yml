name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Run Ruff lint
        run: uv run ruff check .

      - name: Check Ruff formatting
        run: uv run ruff format --check .

      - name: Run mypy
        run: uv run mypy --strict .

      - name: Check documentation coverage
        run: uv run interrogate src/srd_arena

      - name: Check doctest coverage
        run: uv run doctest-audit --fail-under 90

      - name: Build documentation
        run: uv run sphinx-build --fail-on-warning --builder html docs docs/_build/html

      - name: Run pytest
        run: uv run pytest
